# Reverse proxy for the dashboard + future portfolio.
# Listens on port 8081 to avoid clashing with the LMS on 8080.
#
# Architecture:
#   nginx (8081) → dashboard:3001 (Node.js app)
#
# When you add your portfolio, add a `portfolio` service to docker-compose.yml
# and uncomment the /portfolio/ block below.

server {
    listen 80;
    server_name _;

    # Dashboard: proxy all routes to the Node.js app.
    # The app serves both the UI (index.html, app.js, style.css)
    # and the API (/api/*) directly.
    location / {
        proxy_pass http://dashboard:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
