# Reverse proxy for the dashboard + future portfolio.
# Listens on port 8081 to avoid clashing with the LMS on 8080.
#
# Architecture:
#   nginx (8081) → dashboard:3001 (Node.js app)
#
# Access logs are written as one JSON object per line into a volume the
# dashboard container also mounts; lib/traffic.js tails them and turns them
# into per-site traffic stats. Keep this format in sync with parseLine() there.

log_format json_analytics escape=json '{'
    '"time":"$time_iso8601",'
    '"host":"$host",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referrer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.json.log json_analytics;

    # Dashboard: proxy all routes to the Node.js app.
    # The app serves both the UI (index.html, app.js, style.css)
    # and the API (/api/*) directly.
    location / {
        proxy_pass http://dashboard:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # TODO — Portfolio website
    # ==========================================================
    # When you add a portfolio service, uncomment AND adjust.
    # Example 1: portfolio at /portfolio/ path
