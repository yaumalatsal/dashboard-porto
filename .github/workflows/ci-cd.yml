name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job asks for packages: read.
permissions:
  contents: read

# A second push supersedes the first — dashboard is stateless, nothing is lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---- lint + smoke-test the image before publishing ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Syntax check — catches typos without a running container.
      - name: Lint server.js
        run: node --check server.js

      # Build the image and smoke-test the health endpoint.
      - name: Build Docker image
        run: docker build -t dashboard-test .

      - name: Run container and test
        run: |
          docker run -d -p 3001:3001 --name dashboard-test dashboard-test
          # Give the entrypoint time to generate sites.json and start node
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null http://localhost:3001/api/status 2>/dev/null; then
              echo "dashboard responded after ${i}s"
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:3001/api/status
          curl -fsS -o /dev/null http://localhost:3001/
          docker stop dashboard-test

  # ---- build + push the image to GHCR ----
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Container registries reject capitals — lowercase the repo name.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- deploy to the VPS ----
  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          # The heredoc is unquoted so the runner fills in the token and tag
          # before the script is sent. Anything the VPS must expand is escaped.
          ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -seuo pipefail' <<EOF
          set -e
          cd "${{ secrets.VPS_PATH || '/home/ubuntu/dashboard-porto' }}"

          # Initialise the checkout if this is a first deploy.
          if [ ! -d .git ]; then
              git init
          fi

          # Reset the remote URL to a credential-free HTTPS form before
          # fetching. The checkout used to carry an embedded credential in
          # its remote URL (https://<token>@github.com/...). That token
          # expires, so git fetch dies with "could not read Password".
          # This repo is public, so a credential-free URL fetches fine.
          git remote set-url origin https://github.com/${{ github.repository }}.git
          git fetch --prune origin main
          git reset --hard origin/main

          # Regenerate .env.docker.local from GitHub secrets.
          # Compose treats a missing env_file as a fatal error, so always
          # create it (even if empty). Only non-empty values are written.
          cat > .env.docker.local <<LOCAL
          # Auto-generated by CI/CD — do not edit by hand.
          MONITOR_API_TOKEN=${{ secrets.MONITOR_API_TOKEN }}
          LOCAL

          # Authenticate to GHCR so the VPS can pull the private image.
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          export IMAGE_TAG='sha-${{ github.sha }}'

          # --no-build: the app service declares a build context for local
          # development, but production must run what CI published.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull dashboard
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

          # Confirm the dashboard answers.
          for i in \$(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8081/api/status; then
              echo "dashboard up after \$((i * 10))s"
              exit 0
            fi
            sleep 10
          done

          echo "the dashboard did not answer within five minutes" >&2
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=60 dashboard >&2
          exit 1
          EOF
