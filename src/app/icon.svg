<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sighting reticle">
  <!--
    The same mark the header wears: a ring with a sighting cross through it.
    Weights are set for 16px first, where a favicon actually lives — a hairline
    ring disappears at that size, so the ring is heavy and the cross overhangs
    only a little, which keeps the silhouette readable when it is nine pixels
    of gold on a dark tab.
  -->
  <rect width="64" height="64" rx="13" fill="#0E0818"/>
  <g stroke="#DDAE5C" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="32" cy="32" r="15.5"/>
    <path d="M32 6.5v11M32 46.5v11M6.5 32h11M46.5 32h11"/>
  </g>
  <circle cx="32" cy="32" r="5" fill="#EFC967"/>
</svg>
