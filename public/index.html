<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mdzakiyau — service monitor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1>mdzakiyau monitor</h1>
            <div class="last-updated">Updated <span id="last-updated">—</span></div>
        </header>

        <section class="panel">
            <h2 class="panel-title">VPS</h2>
            <div id="host"><div class="loading">Loading…</div></div>
        </section>

        <section class="panel">
            <h2 class="panel-title">
                Traffic
                <select id="traffic-window" aria-label="Traffic window">
                    <option value="5">5 min</option>
                    <option value="15">15 min</option>
                    <option value="60" selected>60 min</option>
                </select>
            </h2>
            <div id="traffic"><div class="loading">Loading…</div></div>
        </section>

        <section class="panel">
            <h2 class="panel-title">Services</h2>
            <main id="main">
                <div class="loading">Loading…</div>
            </main>
        </section>
    </div>

    <script src="/app.js"></script>
</body>
</html>
