services:
  # Node.js monitoring dashboard.
  # Zero runtime npm dependencies — uses only Node.js built-ins.
  dashboard:
    build: .
    container_name: dashboard-app
    restart: unless-stopped
    env_file:
      - .env.docker
      - .env.docker.local   # generated by CI/CD; create for local dev: cp .env.docker.local.example .env.docker.local
    expose:
      - "3001"              # only reachable via nginx (in Docker network), not from the host
    depends_on:
      - nginx

  # Reverse proxy — central entry point for dashboard + future portfolio.
  # Port 8081 avoids clashing with the LMS on 8080.
  nginx:
    image: nginx:alpine
    container_name: dashboard-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard

