services:
  # Portfolio + operations console in one Next.js app.
  #   /         portfolio (WebGL astrolabe, GSAP, Lenis)
  #   /console  operations console (no WebGL, no animation stack)
  web:
    # Both keys on purpose: CI pushes this tag and the VPS `docker compose pull`s
    # it, while a local `docker compose up --build` still builds from source.
    image: ghcr.io/yaumalatsal/dashboard-porto:latest
    build:
      context: .
      dockerfile: dockerfile
      target: runner
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    container_name: dashboard-porto
    restart: unless-stopped
    # Group 4 is `adm` on Debian and Ubuntu, which owns the nginx logs.
    # logrotate recreates them as `0640 www-data adm` every night, so without
    # this the traffic board works until the first rotation and then quietly
    # reports nothing. Joining the group is read access to the logs and
    # nothing else — the container still runs as the unprivileged `nextjs`.
    group_add:
      - "4"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - CONSOLE_DATA_DIR=/app/data
      - CONSOLE_SITES_PATH=/app/data/sites.json
      # Tokens for monitored apps are referenced by name from sites.json
      # (`auth.env`), so the config file itself never contains a secret.
      - MONITOR_API_TOKEN=${MONITOR_API_TOKEN:-}
      # SIMAKSI has its own token; sites.json references it by name.
      - SIMAKSI_MONITOR_TOKEN=${SIMAKSI_MONITOR_TOKEN:-}
      # Unset by default: the console's write endpoints are open. Set it to
      # require X-Console-Token on POST /api/monitor/sites and DELETE.
      - CONSOLE_ADMIN_TOKEN=${CONSOLE_ADMIN_TOKEN:-}
      - CONSOLE_RETENTION_DAYS=${CONSOLE_RETENTION_DAYS:-90}
      # Host samples land every 10s rather than every 30-300s, so they keep a
      # shorter history than the health series.
      - CONSOLE_HOST_RETENTION_DAYS=${CONSOLE_HOST_RETENTION_DAYS:-14}
      # Where the host's procfs and root filesystem appear inside the container
      # (see the volumes below). Without these the console reports on itself.
      - HOST_PROC=/host/proc
      - HOST_ROOTFS=/host/rootfs
      # Directories scanned for nginx access logs, comma-separated. Only files
      # matching NGINX_LOG_PATTERN are tailed, and they must use the
      # json_analytics format from docker/nginx.conf.
      - NGINX_LOG_DIR=${NGINX_LOG_DIR:-/host/var/log/nginx}
      - NGINX_LOG_PATTERN=${NGINX_LOG_PATTERN:-^access.*\.log$$}
      # Which directories the disk breakdown walks, as the HOST sees them —
      # they are resolved under HOST_ROOTFS. /var/lib/containerd comes first
      # because Docker's containerd snapshotter puts image layers there, not
      # under /var/lib/docker: on this VPS that is 11G against 1G.
      - DISK_SCAN_PATHS=${DISK_SCAN_PATHS:-/var/lib/containerd,/var/lib/docker,/var/log,/home,/var/www,/opt,/tmp}
      # A walk is expensive, so it runs on a slow timer with hard budgets.
      # Hitting either marks the report truncated rather than under-reporting.
      - DISK_SCAN_INTERVAL_MS=${DISK_SCAN_INTERVAL_MS:-1800000}
      - DISK_SCAN_ENTRY_BUDGET=${DISK_SCAN_ENTRY_BUDGET:-600000}
      - DISK_SCAN_TIME_BUDGET_MS=${DISK_SCAN_TIME_BUDGET_MS:-90000}
    volumes:
      # Time-series history AND the live site registry. Without this, every
      # redeploy resets uptime to zero and forgets apps added via the console.
      # Deliberately not a bind-mount of ./sites.json: Docker silently creates a
      # directory where the file should be when the host path does not exist.
      - console-data:/app/data
      # The container's own /proc describes the container. Reporting on the
      # machine means reading the host's, mounted read-only.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Disk usage of the VPS root filesystem, not the container's layer.
      - /:/host/rootfs:ro
      # nginx access logs. Remove this if nginx does not run on the host.
      - /var/log/nginx:/host/var/log/nginx:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/monitor/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Development server with hot reload: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: dockerfile
      target: deps
    container_name: dashboard-porto-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MONITOR_API_TOKEN=${MONITOR_API_TOKEN:-}
    command: npm run dev

volumes:
  console-data:
